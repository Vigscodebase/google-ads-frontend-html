<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google Ads — Campaign Manager</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet">
        <style>
        :root {
            --cream: #faf7f2;
            --warm-white: #fff9f2;
            --ink: #1a1510;
            --ink-light: #4a4035;
            --ink-muted: #9a9080;
            --rule: #e8e0d4;
            --accent: #c84b2f;
            --accent-soft: #f5e8e4;
            --accent2: #2a6496;
            --accent2-soft: #e4eef5;
            --gold: #c9973a;
            --gold-soft: #fdf3e3;
            --green: #2d7a4a;
            --green-soft: #e4f0e9;
            --shadow-sm: 0 1px 4px rgba(26,21,16,0.08);
            --shadow-md: 0 4px 20px rgba(26,21,16,0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
        }

        /* Hide page until auth check passes */
        body.auth-pending { visibility: hidden; }

        .top-rule {
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent2) 100%);
        }

        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 32px 80px;
        }

        /* MASTHEAD */
        .masthead {
            padding: 48px 0 36px;
            border-bottom: 2px solid var(--ink);
            margin-bottom: 40px;
            animation: fadeDown 0.7s ease both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .masthead-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .masthead-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .masthead-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -1px;
        }

        .masthead-title em { font-style: italic; color: var(--accent); }

        .masthead-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--ink);
            color: var(--cream);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
            animation: blink 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--rule);
            color: var(--ink-muted);
            padding: 8px 14px;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .logout-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .masthead-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--ink-muted);
        }

        .masthead-meta strong { color: var(--ink-light); font-weight: 500; }

        /* STATS */
        .stats-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--rule);
            border: 1px solid var(--rule);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 40px;
            box-shadow: var(--shadow-sm);
            animation: fadeUp 0.6s 0.1s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .stat-cell {
            background: var(--warm-white);
            padding: 24px 28px;
            transition: background 0.2s;
        }

        .stat-cell:hover { background: #fff; }

        .stat-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-bottom: 8px;
        }

        .stat-val {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
        }

        .stat-val.red  { color: var(--accent); }
        .stat-val.gold { color: var(--gold); }
        .stat-val.blue { color: var(--accent2); }

        /* TOOLBAR */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 16px;
            animation: fadeUp 0.6s 0.15s ease both;
            flex-wrap: wrap;
        }

        .toolbar-left { display: flex; align-items: center; gap: 12px; }

        .section-label {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
        }

        .count-chip {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            background: var(--accent);
            color: #fff;
            padding: 3px 10px;
            border-radius: 3px;
        }

        .search-wrap { position: relative; }

        .search-wrap input {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 13px;
            background: var(--warm-white);
            border: 1px solid var(--rule);
            border-radius: 6px;
            padding: 9px 14px 9px 36px;
            color: var(--ink);
            outline: none;
            width: 240px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .search-wrap input::placeholder { color: var(--ink-muted); }
        .search-wrap input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(42,100,150,0.1);
        }

        .search-icon {
            position: absolute;
            left: 11px; top: 50%;
            transform: translateY(-50%);
            color: var(--ink-muted);
            font-size: 14px;
            pointer-events: none;
        }

        /* TABLE */
        .table-wrap {
            background: var(--warm-white);
            border: 1px solid var(--rule);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            animation: fadeUp 0.6s 0.2s ease both;
        }

        .table-head {
            display: grid;
            grid-template-columns: 52px 1fr 150px 120px 80px;
            background: var(--ink);
            color: var(--cream);
            padding: 12px 20px;
        }

        .th {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(250,247,242,0.55);
            display: flex;
            align-items: center;
        }

        .th.right { justify-content: flex-end; }

        .campaign-row {
            display: grid;
            grid-template-columns: 52px 1fr 150px 120px 80px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--rule);
            align-items: center;
            transition: background 0.15s;
            opacity: 0;
            animation: rowSlide 0.4s ease forwards;
        }

        .campaign-row:last-child { border-bottom: none; }
        .campaign-row:hover { background: #fff5f0; }

        @keyframes rowSlide {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .cell-num {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-muted);
        }

        .name-main {
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
            padding-right: 16px;
        }

        .name-id {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--ink-muted);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

        .badge-pmax   { background: var(--gold-soft);    color: var(--gold);   border: 1px solid rgba(201,151,58,0.25); }
        .badge-pmax   .badge-dot { background: var(--gold); }
        .badge-mobile { background: var(--green-soft);   color: var(--green);  border: 1px solid rgba(45,122,74,0.25); }
        .badge-mobile .badge-dot { background: var(--green); }
        .badge-search { background: var(--accent2-soft); color: var(--accent2); border: 1px solid rgba(42,100,150,0.2); }
        .badge-search .badge-dot { background: var(--accent2); }
        .badge-tcpa   { background: var(--accent-soft);  color: var(--accent); border: 1px solid rgba(200,75,47,0.2); }
        .badge-tcpa   .badge-dot { background: var(--accent); }

        .cell-date {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--ink-muted);
        }

        .cell-action { display: flex; justify-content: flex-end; }

        .copy-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            padding: 5px 10px;
            border: 1px solid var(--rule);
            border-radius: 4px;
            background: transparent;
            color: var(--ink-muted);
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.5px;
        }

        .copy-btn:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
        .copy-btn.copied { background: var(--green); color: #fff; border-color: var(--green); }

        /* STATES */
        .state-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            gap: 14px;
        }

        .spinner {
            width: 32px; height: 32px;
            border: 2px solid var(--rule);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .state-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-muted);
            letter-spacing: 1px;
        }

        .error-text {
            font-size: 13px;
            color: var(--ink-muted);
            text-align: center;
            max-width: 360px;
            line-height: 1.7;
        }

        .empty-text {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-muted);
            letter-spacing: 1px;
            padding: 48px;
            text-align: center;
        }

        /* FOOTER */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--rule);
            display: flex;
            justify-content: space-between;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--ink-muted);
            letter-spacing: 1px;
            animation: fadeUp 0.6s 0.4s ease both;
        }

        @media (max-width: 680px) {
            .page { padding: 0 16px 60px; }
            .table-head,
            .campaign-row { grid-template-columns: 36px 1fr 100px 44px; }
            .col-date { display: none; }
            .stats-strip { grid-template-columns: 1fr 1fr; }
            .stats-strip .stat-cell:last-child { grid-column: 1/-1; }
            .search-wrap input { width: 160px; }
            .masthead-top { flex-direction: column; gap: 14px; }
        }
    </style>
    </head>
    <body class="auth-pending">

        <div class="top-rule"></div>
        <div class="page">

            <div class="masthead">
                <div class="masthead-top">
                    <div>
                        <div class="masthead-eyebrow">Google Ads · Campaign
                            Manager</div>
                        <div class="masthead-title">Campaign
                            <em>Intelligence</em></div>
                    </div>
                    <div class="masthead-right">
                        <div class="live-badge">
                            <span class="live-dot"></span>LIVE DATA
                        </div>
                        <button class="logout-btn" id="btn-logout">⏻ SIGN
                            OUT</button>
                    </div>
                </div>
                <div class="masthead-meta">
                    <span>Signed in as &nbsp;<strong
                            id="meta-user">—</strong></span>
                    <span>·</span>
                    <span>Customer &nbsp;<strong id="meta-cid">—</strong></span>
                    <span>·</span>
                    <span>Fetched at &nbsp;<strong
                            id="meta-time">—</strong></span>
                </div>
            </div>

            <div class="stats-strip">
                <div class="stat-cell">
                    <div class="stat-label">Total Campaigns</div>
                    <div class="stat-val red" id="stat-total">—</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-label">PMax Campaigns</div>
                    <div class="stat-val gold" id="stat-pmax">—</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-label">TCPA Campaigns</div>
                    <div class="stat-val blue" id="stat-tcpa">—</div>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="section-label">All Campaigns</div>
                    <div class="count-chip" id="count-chip">…</div>
                </div>
                <div class="search-wrap">
                    <span class="search-icon">⌕</span>
                    <input type="text" id="search"
                        placeholder="Search name or ID…"
                        oninput="filterCampaigns(this.value)" />
                </div>
            </div>

            <div class="table-wrap">
                <div class="state-box" id="loading">
                    <div class="spinner"></div>
                    <div class="state-label">FETCHING CAMPAIGNS…</div>
                </div>
                <div class="state-box" id="error-box" style="display:none;">
                    <div style="font-size:32px;">⚠</div>
                    <div class="error-text" id="error-msg">An error
                        occurred.</div>
                </div>
                <div id="table-inner" style="display:none;">
                    <div class="table-head">
                        <div class="th">#</div>
                        <div class="th">Campaign</div>
                        <div class="th">Type</div>
                        <div class="th col-date">Date</div>
                        <div class="th right">ID</div>
                    </div>
                    <div id="campaign-list"></div>
                    <div class="empty-text" id="empty" style="display:none;">NO
                        RESULTS FOUND</div>
                </div>
            </div>

            <div class="footer">
                <span>GOOGLE ADS API · V23</span>
                <span id="footer-count">—</span>
            </div>

        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script>
    const API      = 'https://americanssupport.org/gads/api';
    const token    = localStorage.getItem('sessionToken');
    const username = localStorage.getItem('username');
    let   allCampaigns = [];

    // ── Auth guard ────────────────────────────────────────────────────────────
    if (!token) {
        window.location.href = 'index.html';
    } else {
        // Verify token is still valid before showing page
        fetch(`${API}/logincheck/me`, {
            headers: { 'x-session-token': token }
        }).then(r => {
            if (!r.ok) {
                localStorage.removeItem('sessionToken');
                localStorage.removeItem('username');
                window.location.href = 'index.html';
            } else {
                document.body.classList.remove('auth-pending');
                document.getElementById('meta-user').textContent = username || '—';
                loadData();
            }
        }).catch(() => {
            // Network error — still show page (offline tolerance)
            document.body.classList.remove('auth-pending');
            document.getElementById('meta-user').textContent = username || '—';
            loadData();
        });
    }

    // ── Logout ────────────────────────────────────────────────────────────────
    document.getElementById('btn-logout').addEventListener('click', async () => {
        try {
            await fetch(`${API}/logincheck/logout`, {
                method:  'POST',
                headers: { 'x-session-token': token }
            });
        } catch {}
        localStorage.removeItem('sessionToken');
        localStorage.removeItem('username');
        window.location.href = 'index.html';
    });

    // ── Helpers ───────────────────────────────────────────────────────────────
    function authHeaders() {
        return {
            'x-session-token': token
        };
    }

    function getType(name) {
        const n = name.toUpperCase();
        if (n.includes('PMAX'))  return { label: 'PMAX',   cls: 'badge-pmax'   };
        if (n.includes('TCPA'))  return { label: 'TCPA',   cls: 'badge-tcpa'   };
        if (n.startsWith('M -')) return { label: 'MOBILE', cls: 'badge-mobile' };
        return                          { label: 'SEARCH', cls: 'badge-search' };
    }

    function extractDate(name) {
        const m = name.match(/(\d{2}\/\d{2})/);
        return m ? m[1] : '—';
    }

    function renderCampaigns(list) {
        const el    = document.getElementById('campaign-list');
        const empty = document.getElementById('empty');
        if (!list.length) { el.innerHTML = ''; empty.style.display = 'block'; return; }
        empty.style.display = 'none';
        el.innerHTML = list.map((c, i) => {
            const t  = getType(c.campaign.name);
            const dt = extractDate(c.campaign.name);
            return `
            <div class="campaign-row" style="animation-delay:${i * 35}ms">
                <div class="cell-num">${String(i+1).padStart(2,'0')}</div>
                <div>
                    <div class="name-main" title="${c.campaign.name}">${c.campaign.name}</div>
                    <div class="name-id">${c.campaign.id}</div>
                </div>
                <div>
                    <span class="badge ${t.cls}">
                        <span class="badge-dot"></span>${t.label}
                    </span>
                </div>
                <div class="cell-date col-date">${dt}</div>
                <div class="cell-action">
                    <button class="copy-btn" onclick="copyId(this,'${c.campaign.id}')">COPY</button>
                </div>
            </div>`;
        }).join('');
    }

    function filterCampaigns(q) {
        q = q.toLowerCase();
        const f = allCampaigns.filter(c =>
            c.campaign.name.toLowerCase().includes(q) || c.campaign.id.includes(q)
        );
        document.getElementById('count-chip').textContent = f.length;
        renderCampaigns(f);
    }

    function copyId(btn, id) {
        navigator.clipboard.writeText(id).then(() => {
            btn.textContent = '✓ DONE';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1800);
        });
    }

    function showError(msg) {
        document.getElementById('loading').style.display     = 'none';
        document.getElementById('table-inner').style.display = 'none';
        document.getElementById('error-box').style.display   = 'flex';
        document.getElementById('error-msg').textContent =
            typeof msg === 'object' ? JSON.stringify(msg) : msg;
    }

    // ── Load campaigns ────────────────────────────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    const userId    = urlParams.get('userId');

    function loadData() {
        if (!userId) {
            showError('No userId found in URL. Please re-authorise with Google.');
            return;
        }

        axios.get(`${API}/auth/customers?userId=${userId}`, { headers: authHeaders() })
            .then(res => {
                const ids = res.data.customerIds;
                if (!ids || !ids.length) throw new Error('No customer IDs returned.');
                const cid = ids[0];
                document.getElementById('meta-cid').textContent = cid;
                return axios.get(
                    `${API}/auth/ads-listing?userId=${userId}&customerId=${cid}`,
                    { headers: authHeaders() }
                );
            })
            .then(res => {
                allCampaigns = res.data.results || [];
                const pmax = allCampaigns.filter(c => c.campaign.name.toUpperCase().includes('PMAX')).length;
                const tcpa = allCampaigns.filter(c => c.campaign.name.toUpperCase().includes('TCPA')).length;

                document.getElementById('stat-total').textContent   = allCampaigns.length;
                document.getElementById('stat-pmax').textContent    = pmax;
                document.getElementById('stat-tcpa').textContent    = tcpa;
                document.getElementById('count-chip').textContent   = allCampaigns.length;
                document.getElementById('footer-count').textContent = `${allCampaigns.length} RECORDS`;
                document.getElementById('meta-time').textContent    =
                    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                document.getElementById('loading').style.display     = 'none';
                document.getElementById('table-inner').style.display = 'block';
                renderCampaigns(allCampaigns);
            })
            .catch(err => {
                // 401 = session expired
                if (err.response?.status === 401) {
                    localStorage.removeItem('sessionToken');
                    window.location.href = 'index.html';
                } else {
                    showError(err.response?.data?.error || err.message);
                }
            });
    }
</script>
    </body>
</html>

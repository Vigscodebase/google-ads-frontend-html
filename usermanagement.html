                    <!-- Newsbreak Dropdown -->
                    <div class="nav-item dropdown children-dropdown">
                        <div class="dropdown-toggle" id="newsBreakToggle">
                            <span class="nav-icon">⊞</span> Google Ads
                            <span class="arrow-right">▸</span>
                            <span class="arrow-down">▾</span>
                        </div>

                        <div class="dropdown-menu" id="googleAdsMenu">
                            <a class="nav-sub-item" href="dashboard.html">

                            </a>
                            <a class="nav-sub-item"

                        </div>
                    </div>
                    <!-- Other Menu Items -->
                    <a id="usr-management" class="nav-item"

                        <span class="nav-icon">⊞</span> User Management
                    </a>
                    <!-- <a id="account-access" class="nav-item"
                        href="accountaccess.html">
                        <span class="nav-icon">⊞</span>Account Access
                    </a> -->

                <div class="sidebar-bottom">
                    <div class="admin-pill">
                        <div class="admin-avatar" id="admin-avatar">—</div>
                        <div class="admin-email" id="admin-email">—</div>
                    </div>
                    <button class="btn-logout" id="btn-logout">Sign Out</button>
                </div>
            </aside>

            <main class="main">

                <div class="page-header">
                    <div>
                        <div class="page-eyebrow">Google Ads</div>
                        <div class="page-title">User
                            <span>Management</span></div>
                    </div>
                </div>

                <button class="btn-primary add-user-btn"
                    onclick="openAddUser()">+ Add User</button>

                <!-- Table -->
                <div class="table-wrap">
                    <div class="state-box" id="loading">
                        <div class="spinner"></div>
                        <div class="state-label">Fetching accounts…</div>
                    </div>
                    <div id="table-inner" style="display:none;">
                        <div class="table-head camp-grid">
                            <div class="th">#</div>
                            <div class="th">Name</div>
                            <div class="th">Email</div>
                            <div class="th">Role</div>
                            <div class="th">Actions</div>
                        </div>
                        <div id="usr-management-list"></div>
                        <div class="empty-text" id="empty"
                            style="display:none;">
                            No accounts connected — add one above
                        </div>
                    </div>
                </div>

                <div class="page-footer">
                    <span>Google Ads API · User Manager</span>
                    <span id="footer-time">—</span>
                </div>

            </main>
        </div>

        <!-- ✅ EDIT MODAL -->
        <div id="editModal" class="modal">
            <div class="edit-modal-content">
                <span class="close" id="closeModal">&times;</span>

                <h2>Edit User</h2>

                <input type="hidden" id="editUserId">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="editName">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="text" id="editEmail">
                    <!-- <span class="adduser-info">Google Ad account email only
                        allowed</span> -->
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="editPassword"
                        placeholder="Leave blank to keep current password">
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <select id="editRole">
                        <!-- <option value="Super Admin">Super Admin</option>
                        <option value="user">User</option> -->
                    </select>
                </div>

                <div class="form-group">
                    <label>Account Access</label>
                    <div id="oauthCheckboxList" class="checkbox-scroll"></div>
                </div>

                <div class="form-actions">
                    <button class="btn-primary"
                        onclick="updateUser()">Update</button>
                </div>
            </div>
        </div>

        <!-- ✅ DELETE MODAL -->
        <div id="deleteModal" class="modal">
            <div class="delete-modal-content">
                <span class="close" id="closeDeleteModal">&times;</span>

                <h2>Delete User</h2>

                <!-- Hidden ID -->
                <input type="hidden" id="deleteUserId">

                <p>Are you sure you want to delete this user?</p>

                <div class="form-actions">
                    <button class="btn-secondary"
                        onclick="closeDelete()">Cancel</button>
                    <button class="btn-danger"
                        onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>

        <!-- ✅ ADD USER MODAL -->
        <div id="addUserModal" class="modal">
            <div class="delete-modal-content">
                <span class="close" id="closeAddModal">&times;</span>

                <h2>Add User</h2>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="addName">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="text" id="addEmail">
                    <!-- <span class="adduser-info">Google Ad account email only
                        allowed</span> -->
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="addPassword">
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <select id="addRole"></select>
                </div>

                <div class="form-actions">
                    <button class="btn-secondary"
                        onclick="closeAddUser()">Cancel</button>
                    <button class="btn-primary"
                        onclick="createUser()">Create</button>
                </div>
            </div>
        </div>

        <script>
    document.getElementById('footer-time').textContent =
        'Updated ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
</script>
        <script
            src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/cjs/index.min.js"></script>
        <script src="assets/js/usermanagement121.js"></script>
    </body>
</html>
